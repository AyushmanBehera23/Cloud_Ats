---
# Recruiter, Analytics, Notification, and API Gateway services
# (Following same pattern — abbreviated for clarity)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: recruiter-service
  namespace: cloudats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recruiter-service
  template:
    metadata:
      labels:
        app: recruiter-service
    spec:
      containers:
        - name: recruiter-service
          image: cloudats/recruiter-service:latest
          ports: [{ containerPort: 8084 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "docker" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/cloudats?currentSchema=recruiter_schema" }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { configMapKeyRef: { name: cloudats-config, key: POSTGRES_USER } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: cloudats-secrets, key: POSTGRES_PASSWORD } } }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: recruiter-service, namespace: cloudats }
spec: { selector: { app: recruiter-service }, ports: [{ port: 8084, targetPort: 8084 }] }

---
apiVersion: apps/v1
kind: Deployment
metadata: { name: analytics-service, namespace: cloudats }
spec:
  replicas: 1
  selector: { matchLabels: { app: analytics-service } }
  template:
    metadata: { labels: { app: analytics-service } }
    spec:
      containers:
        - name: analytics-service
          image: cloudats/analytics-service:latest
          ports: [{ containerPort: 8085 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "docker" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/cloudats" }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { configMapKeyRef: { name: cloudats-config, key: POSTGRES_USER } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: cloudats-secrets, key: POSTGRES_PASSWORD } } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 300m, memory: 512Mi }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8085 }, initialDelaySeconds: 60, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8085 }, initialDelaySeconds: 30, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: analytics-service, namespace: cloudats }
spec: { selector: { app: analytics-service }, ports: [{ port: 8085, targetPort: 8085 }] }

---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notification-service, namespace: cloudats }
spec:
  replicas: 1
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      containers:
        - name: notification-service
          image: cloudats/notification-service:latest
          ports: [{ containerPort: 8086 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "docker" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/cloudats?currentSchema=notification_schema" }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { configMapKeyRef: { name: cloudats-config, key: POSTGRES_USER } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: cloudats-secrets, key: POSTGRES_PASSWORD } } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 300m, memory: 512Mi }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8086 }, initialDelaySeconds: 60, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8086 }, initialDelaySeconds: 30, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: notification-service, namespace: cloudats }
spec: { selector: { app: notification-service }, ports: [{ port: 8086, targetPort: 8086 }] }

---
# API Gateway
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: cloudats }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: cloudats/api-gateway:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "docker" }
            - { name: AUTH_SERVICE_URL, value: "http://auth-service:8081" }
            - { name: RESUME_SERVICE_URL, value: "http://resume-service:8082" }
            - { name: ATS_SCORING_SERVICE_URL, value: "http://ats-scoring-service:8083" }
            - { name: RECRUITER_SERVICE_URL, value: "http://recruiter-service:8084" }
            - { name: ANALYTICS_SERVICE_URL, value: "http://analytics-service:8085" }
            - { name: NOTIFICATION_SERVICE_URL, value: "http://notification-service:8086" }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 60, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 30, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: cloudats }
spec: { selector: { app: api-gateway }, ports: [{ port: 8080, targetPort: 8080 }], type: NodePort }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api-gateway-hpa, namespace: cloudats }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-gateway }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
