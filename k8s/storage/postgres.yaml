apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: cloudats
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cloudats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cloudats-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: cloudats-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudats-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "cloudats_admin", "-d", "cloudats"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cloudats_admin", "-d", "cloudats"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-script
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cloudats
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: cloudats
data:
  init-db.sql: |
    CREATE SCHEMA IF NOT EXISTS auth_schema;
    CREATE SCHEMA IF NOT EXISTS resume_schema;
    CREATE SCHEMA IF NOT EXISTS scoring_schema;
    CREATE SCHEMA IF NOT EXISTS recruiter_schema;
    CREATE SCHEMA IF NOT EXISTS analytics_schema;
    CREATE SCHEMA IF NOT EXISTS notification_schema;
    GRANT ALL PRIVILEGES ON SCHEMA auth_schema TO cloudats_admin;
    GRANT ALL PRIVILEGES ON SCHEMA resume_schema TO cloudats_admin;
    GRANT ALL PRIVILEGES ON SCHEMA scoring_schema TO cloudats_admin;
    GRANT ALL PRIVILEGES ON SCHEMA recruiter_schema TO cloudats_admin;
    GRANT ALL PRIVILEGES ON SCHEMA analytics_schema TO cloudats_admin;
    GRANT ALL PRIVILEGES ON SCHEMA notification_schema TO cloudats_admin;
