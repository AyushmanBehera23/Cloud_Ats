server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # Auth Service
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        # Resume Service
        - id: resume-service
          uri: ${RESUME_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/resumes/**

        # ATS Scoring Service
        - id: ats-scoring-service
          uri: ${ATS_SCORING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/scores/**

        # Recruiter Service
        - id: recruiter-service
          uri: ${RECRUITER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/recruiter/**

        # Analytics Service
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/analytics/**

        # Notification Service
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
