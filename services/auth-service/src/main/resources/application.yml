server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/cloudats?currentSchema=auth_schema
    username: cloudats_admin
    password: cloudats_secret_2024
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: auth_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    schemas: auth_schema
    locations: classpath:db/migration

jwt:
  secret: cloudats-jwt-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-algorithm
  access-expiration-ms: 900000      # 15 minutes
  refresh-expiration-ms: 604800000  # 7 days

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
