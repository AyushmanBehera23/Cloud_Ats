server:
  port: 8086
spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/cloudats?currentSchema=notification_schema
    username: cloudats_admin
    password: cloudats_secret_2024
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification_schema
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: notification_schema
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
