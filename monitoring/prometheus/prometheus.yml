global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "auth-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: "resume-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["resume-service:8082"]

  - job_name: "ats-scoring-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["ats-scoring-service:8083"]

  - job_name: "recruiter-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["recruiter-service:8084"]

  - job_name: "analytics-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["analytics-service:8085"]

  - job_name: "notification-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["notification-service:8086"]

  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api-gateway:8080"]
