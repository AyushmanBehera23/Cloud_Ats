# ============================================================================
# CloudATS — Docker Compose (Full Development Stack)
# ============================================================================
# Usage:
#   docker-compose up -d             # Start all services
#   docker-compose logs -f           # Follow logs
#   docker-compose down -v           # Stop and remove volumes
# ============================================================================

networks:
  cloudats-network:
    driver: bridge
    name: cloudats-network

volumes:
  postgres-data:
    name: cloudats-postgres-data
  minio-data:
    name: cloudats-minio-data
  prometheus-data:
    name: cloudats-prometheus-data
  grafana-data:
    name: cloudats-grafana-data

# ============================================================================
# INFRASTRUCTURE SERVICES
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # PostgreSQL 16 — Shared database with schema-per-service isolation
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cloudats-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"  # Host 5433 → Container 5432 (5432 already in use by another project)
    environment:
      POSTGRES_DB: cloudats
      POSTGRES_USER: cloudats_admin
      POSTGRES_PASSWORD: cloudats_secret_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    networks:
      - cloudats-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudats_admin -d cloudats"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for resume files
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: cloudats-minio
    restart: unless-stopped
    ports:
      - "9002:9000"   # API port (host 9002 → container 9000)
      - "9003:9001"   # Console UI port (host 9003 → container 9001)
    environment:
      MINIO_ROOT_USER: cloudats_minio
      MINIO_ROOT_PASSWORD: cloudats_minio_secret_2024
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - cloudats-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # MinIO Client — Auto-create the resume bucket on startup
  # --------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: cloudats-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set cloudats http://minio:9000 cloudats_minio cloudats_minio_secret_2024;
        mc mb cloudats/resumes --ignore-existing;
        mc anonymous set download cloudats/resumes;
        echo 'MinIO bucket [resumes] initialized successfully';
        exit 0;
      "
    networks:
      - cloudats-network

# ============================================================================
# APPLICATION SERVICES
# ============================================================================

  # --------------------------------------------------------------------------
  # Auth Service — Registration, Login, JWT, RBAC (port 8081)
  # --------------------------------------------------------------------------
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: cloudats-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudats?currentSchema=auth_schema
      SPRING_DATASOURCE_USERNAME: cloudats_admin
      SPRING_DATASOURCE_PASSWORD: cloudats_secret_2024
      JWT_SECRET: cloudats-jwt-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-algorithm
      JWT_ACCESS_EXPIRATION_MS: 900000
      JWT_REFRESH_EXPIRATION_MS: 604800000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudats-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # --------------------------------------------------------------------------
  # Resume Service — Upload, Parse PDF/DOCX, Store in MinIO (port 8082)
  # --------------------------------------------------------------------------
  resume-service:
    build:
      context: ./services/resume-service
      dockerfile: Dockerfile
    container_name: cloudats-resume-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudats?currentSchema=resume_schema
      SPRING_DATASOURCE_USERNAME: cloudats_admin
      SPRING_DATASOURCE_PASSWORD: cloudats_secret_2024
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: cloudats_minio
      MINIO_SECRET_KEY: cloudats_minio_secret_2024
      MINIO_BUCKET: resumes
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - cloudats-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # --------------------------------------------------------------------------
  # ATS Scoring Service — 9-specialization weighted scoring engine (port 8083)
  # --------------------------------------------------------------------------
  ats-scoring-service:
    build:
      context: ./services/ats-scoring-service
      dockerfile: Dockerfile
    container_name: cloudats-ats-scoring-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudats?currentSchema=scoring_schema
      SPRING_DATASOURCE_USERNAME: cloudats_admin
      SPRING_DATASOURCE_PASSWORD: cloudats_secret_2024
      RESUME_SERVICE_URL: http://resume-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      resume-service:
        condition: service_healthy
    networks:
      - cloudats-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # --------------------------------------------------------------------------
  # Recruiter Service — Candidate search, shortlisting, JD management (port 8084)
  # --------------------------------------------------------------------------
  recruiter-service:
    build:
      context: ./services/recruiter-service
      dockerfile: Dockerfile
    container_name: cloudats-recruiter-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudats?currentSchema=recruiter_schema
      SPRING_DATASOURCE_USERNAME: cloudats_admin
      SPRING_DATASOURCE_PASSWORD: cloudats_secret_2024
      ATS_SCORING_SERVICE_URL: http://ats-scoring-service:8083
      RESUME_SERVICE_URL: http://resume-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      ats-scoring-service:
        condition: service_healthy
    networks:
      - cloudats-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # --------------------------------------------------------------------------
  # Analytics Service — Cross-schema dashboard metrics (port 8085)
  # --------------------------------------------------------------------------
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: cloudats-analytics-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudats
      SPRING_DATASOURCE_USERNAME: cloudats_admin
      SPRING_DATASOURCE_PASSWORD: cloudats_secret_2024
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudats-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # --------------------------------------------------------------------------
  # Notification Service — Async event notifications (port 8086)
  # --------------------------------------------------------------------------
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: cloudats-notification-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudats?currentSchema=notification_schema
      SPRING_DATASOURCE_USERNAME: cloudats_admin
      SPRING_DATASOURCE_PASSWORD: cloudats_secret_2024
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudats-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # --------------------------------------------------------------------------
  # API Gateway — Single entry point for all services (port 8080)
  # --------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: cloudats-api-gateway
    restart: unless-stopped
    ports:
      - "18080:8080"  # Host 18080 → Container 8080 (8080 in use by another Java app)
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: http://auth-service:8081
      RESUME_SERVICE_URL: http://resume-service:8082
      ATS_SCORING_SERVICE_URL: http://ats-scoring-service:8083
      RECRUITER_SERVICE_URL: http://recruiter-service:8084
      ANALYTICS_SERVICE_URL: http://analytics-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
    depends_on:
      auth-service:
        condition: service_healthy
      resume-service:
        condition: service_healthy
      ats-scoring-service:
        condition: service_healthy
      recruiter-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - cloudats-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

# ============================================================================
# MONITORING
# ============================================================================

  # --------------------------------------------------------------------------
  # Prometheus — Metrics collection
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: cloudats-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - cloudats-network

  # --------------------------------------------------------------------------
  # Grafana — Metrics visualization
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: cloudats-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cloudats_grafana_2024
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - cloudats-network
    depends_on:
      - prometheus
